[project]
name = "eco"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "openwakeword>=0.4.0",
    "pvporcupine>=4.0.3",
    "pypdf>=5",
    "pyside6-essentials>=6.12.0",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "tokenizers>=0.23",
    "tzdata>=2026.6",
    "vosk>=0.3.45",
    "youtube-transcript-api>=1.2.5",
]

[project.scripts]
eco = "eco:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
